<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal - Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="dashboard-page">
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top">
        <div class="container-fluid">
            <a class="navbar-brand d-flex align-items-center" href="#">
                <i class="bi bi-mortarboard-fill me-2 brand-icon"></i>
                <span class="brand-text">Student Portal</span>
            </a>
            <div class="ms-auto d-flex align-items-center">
                <span class="navbar-text me-3 text-white-50">Welcome, <strong id="navUsername">Student</strong></span>
                <button class="btn btn-sm btn-outline-light" id="navLogout">Logout</button>
            </div>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row">
            <aside class="col-md-3 col-lg-2 sidebar">
                <div class="sidebar-sticky pt-3">
                    <ul class="nav flex-column">
                        <li class="nav-item">
                            <a class="nav-link active" href="#" data-section="dashboard">
                                <i class="bi bi-speedometer2 me-2"></i>Dashboard
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#" data-section="courses">
                                <i class="bi bi-book me-2"></i>My Courses
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#" data-section="attendance">
                                <i class="bi bi-calendar-check me-2"></i>Attendance
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#" data-section="grades">
                                <i class="bi bi-clipboard-data me-2"></i>Grades
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#" data-section="assignments">
                                <i class="bi bi-journal-text me-2"></i>Assignments
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#" data-section="schedule">
                                <i class="bi bi-calendar-event me-2"></i>Schedule
                            </a>
                        </li>
                    </ul>
                </div>
            </aside>

            <main class="col-md-9 ms-sm-auto col-lg-10 main-content">
                <div class="page-header mb-4">
                    <h1 id="greeting">Good Morning</h1>
                    <p id="dateDisplay" class="text-muted mb-0"></p>
                </div>

                <div id="contentArea"></div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="dashboard.js"></script>
</body>
</html>
